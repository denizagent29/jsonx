[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "jsonx"
version = "0.1.0"
description = "JSONX text and BJSONX binary format: parser, resolver, schema compiler, zero-copy views"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []                       # the library is standard-library only

[project.urls]
Homepage = "https://github.com/denizagent29/jsonx"
Source = "https://github.com/denizagent29/jsonx"
Issues = "https://github.com/denizagent29/jsonx/issues"

[project.scripts]
jsonxc = "jsonx.cli:main"

[dependency-groups]
# `uv sync --group bench` / `uv run --group bench ...`: comparison libraries for benchmarks/bench.py
bench = ["msgpack>=1.0", "cbor2>=5.6", "pymongo>=4.6", "fastavro>=1.9", "grpcio-tools>=1.60"]
dev = []

[tool.uv.build-backend]
module-root = ""            # the package lives at ./jsonx (flat layout), not ./src/jsonx
module-name = "jsonx"

[tool.uv]
default-groups = ["dev"]
