[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "jsonx"
version = "0.1.0"
description = "JSONX text and BJSONX binary format"
requires-python = ">=3.9"
license = { text = "MIT" }
[project.scripts]
jsonxc = "jsonx.cli:main"
[tool.setuptools]
packages = ["jsonx"]
