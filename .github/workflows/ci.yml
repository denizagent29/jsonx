name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
env: { CARGO_TERM_COLOR: always }

jobs:
  vectors:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --project implementations/python python tests/generate_vectors.py > /dev/null
      - name: committed vectors must equal freshly generated ones
        run: git diff --exit-code --stat -- tests/vectors

  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: "implementations/python/uv.lock" }
      - run: uv sync --locked --python ${{ matrix.python }} --project implementations/python
      - run: uv run --locked --python ${{ matrix.python }} --project implementations/python python tests/test_python.py
      - run: uv run --locked --python ${{ matrix.python }} --project implementations/python python tests/test_http.py
      - name: CLI smoke test (installed entry point)
        shell: bash
        run: |
          run() { uv run --locked --quiet --python ${{ matrix.python }} --project implementations/python "$@"; }
          run jsonxc compile examples/schemas/lesson.jxs -o "$RUNNER_TEMP/l.jxsb"
          run jsonxc encode examples/text/lesson.jsonx -s examples/schemas/lesson.jxs --crc -o "$RUNNER_TEMP/l.bjsonx"
          run jsonxc decode "$RUNNER_TEMP/l.bjsonx" -s "$RUNNER_TEMP/l.jxsb" | head -c 200
      - name: lock file is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv lock --check --project implementations/python

  javascript:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: ["18", "20", "22"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: node tests/test_js.mjs
      - name: TypeScript definitions type-check
        run: npx --yes -p typescript tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 tests/typecheck.ts

  go:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.22", "1.23", "stable"]
    defaults: { run: { working-directory: implementations/go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}", cache-dependency-path: implementations/go/go.mod }
      - run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go test -count=1 -race ./...

  rust:
    name: rust ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: ["1.75", stable]
    defaults: { run: { working-directory: implementations/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.toolchain }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: implementations/rust }
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release
      - name: examples build
        run: cargo build --release --examples

  cross-language:
    name: interop + CLI parity (python, node, go, rust)
    runs-on: ubuntu-latest
    needs: [python, javascript, go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache-dependency-path: implementations/go/go.mod }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: implementations/rust }
      - run: tests/interop.sh
      - run: tests/cli_parity.sh
