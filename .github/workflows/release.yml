name: Release
# Tag vX.Y.Z -> run the whole test-suite, build jsonxc binaries for 5 platforms, a Python sdist+wheel, an npm tarball and the source archive,
# and attach everything to a GitHub release. Publishing to crates.io / PyPI / npm is intentionally NOT automated here (needs registry credentials).
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
env: { CARGO_TERM_COLOR: always }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache-dependency-path: implementations/go/go.mod }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: implementations/rust }
      - run: tests/run_all.sh

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release -p jsonxc --target ${{ matrix.target }}
        working-directory: implementations/rust
      - name: package
        shell: bash
        run: |
          name="jsonxc-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir "$name"; cp LICENSE README.md "$name"/
          bin=implementations/rust/target/${{ matrix.target }}/release/jsonxc; [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "$name"/
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: "jsonxc-${{ matrix.target }}", path: "${{ env.ASSET }}" }

  packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: python sdist + wheel
        run: uv build implementations/python --out-dir dist
      - name: npm tarball
        run: cd implementations/js && npm pack --pack-destination ../../dist
      - name: source archive (with golden vectors)
        run: git archive --format=tar.gz --prefix=jsonx-${GITHUB_REF_NAME:-dev}/ -o dist/jsonx-${GITHUB_REF_NAME:-dev}-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: dist/ }

  publish:
    needs: [binaries, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
