name: Benchmarks
# Manual or weekly. Numbers from shared runners are noisy: compare ratios inside one run, never across runs.
on:
  workflow_dispatch:
    inputs:
      users: { description: "number of user records", default: "10000" }
  schedule: [{ cron: "17 3 * * 1" }]
permissions: { contents: read }
env: { CARGO_TERM_COLOR: always }

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache-dependency-path: implementations/go/go.mod }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: implementations/rust }
      - name: install comparison libraries (MessagePack, CBOR, BSON, Avro, Protobuf) from the locked "bench" group
        run: uv sync --locked --group bench --project implementations/python
      - name: run all benchmarks
        env: { BENCH_N: "${{ github.event.inputs.users || '10000' }}" }
        run: benchmarks/run_all.sh
      - name: publish to the job summary
        run: cat benchmarks/results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: benchmark-results, path: benchmarks/results/ }
